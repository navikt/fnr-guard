name: fnr-guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fnr-guard:
    name: Skann for fødselsnumre
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Kjør fnr-guard fra dette repoet
        # Bytt til $/ når actionlint støtter self-repository-syntaksen (1.7.12 gjør ikke det).
        # ./ er trygt her: checkout er eneste steg før, så ingenting annet kan ligge i arbeidsmappen.
        uses: ./ # zizmor: ignore[self-repository]
